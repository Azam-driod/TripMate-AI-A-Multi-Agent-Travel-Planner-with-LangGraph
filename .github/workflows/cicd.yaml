name: TripMate CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tripmate
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ##############################
  # Continuous Integration
  ##############################
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest

      - name: Run Linter
        run: |
          pip install flake8
          flake8 .

      - name: Build Docker Image
        run: |
          docker build -t tripmate:${{ env.IMAGE_TAG }} .

  ##############################
  # Continuous Deployment
  ##############################
  deploy:
    name: Push to ECR & Deploy to EC2
    needs: ci

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      #################################
      # Configure AWS
      #################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      #################################
      # Login to Amazon ECR
      #################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      #################################
      # Build Docker Image
      #################################

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.ECR_REPOSITORY }}:latest .

      #################################
      # Tag Docker Image
      #################################

      - name: Tag Docker Image
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

          docker tag ${{ env.ECR_REPOSITORY }}:latest \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      #################################
      # Push Docker Image
      #################################

      - name: Push Docker Image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      #################################
      # Deploy to EC2
      #################################

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "Logging into Amazon ECR..."

            aws ecr get-login-password \
            --region us-east-1 | docker login \
            --username AWS \
            --password-stdin <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com

            echo "Pulling latest image..."

            docker pull <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/tripmate:latest

            echo "Stopping existing container..."

            docker stop tripmate || true
            docker rm tripmate || true

            echo "Removing unused images..."

            docker image prune -af

            echo "Starting TripMate..."

            docker run -d \
              --name tripmate \
              --restart always \
              -p 8000:8000 \
              -e GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
              -e TAVILY_API_KEY="${{ secrets.TAVILY_API_KEY }}" \
              -e AVIATIONSTACK_API_KEY="${{ secrets.AVIATIONSTACK_API_KEY }}" \
              -e LANGSMITH_API_KEY="${{ secrets.LANGSMITH_API_KEY }}" \
              <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/tripmate:latest

            docker ps
