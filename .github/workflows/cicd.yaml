name: TripMate CI/CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1               # Change if needed
  ECR_REPOSITORY: tripmate
  IMAGE_TAG: latest

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest flake8

      - name: Run Tests (if present)
        run: |
          if [ -d tests ]; then
            pytest
          else
            echo "No tests directory found. Skipping tests."
          fi

      - name: Run Linter
        run: |
          flake8 . || true

      - name: Build Docker Image
        run: |
          docker build -t tripmate:${{ github.sha }} .

  cd:
    name: Push to ECR & Deploy to EC2

    needs: ci

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,AWS_ACCOUNT_ID,GROQ_API_KEY,TAVILY_API_KEY,AVIATIONSTACK_API_KEY,LANGSMITH_API_KEY

          script: |
            set -e

            aws ecr get-login-password --region $AWS_REGION | docker login \
              --username AWS \
              --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

            docker pull $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/tripmate:latest

            docker stop tripmate || true
            docker rm tripmate || true

            docker run -d \
              --name tripmate \
              --restart unless-stopped \
              -p 8000:8000 \
              -e GROQ_API_KEY="$GROQ_API_KEY" \
              -e TAVILY_API_KEY="$TAVILY_API_KEY" \
              -e AVIATIONSTACK_API_KEY="$AVIATIONSTACK_API_KEY" \
              -e LANGSMITH_API_KEY="$LANGSMITH_API_KEY" \
              $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/tripmate:latest
